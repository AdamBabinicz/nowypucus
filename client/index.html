    <!-- 3. Krytyczny CSS: stabilizacja geometrii nagłówków H1, tła i zerowy CLS -->
    <style>
      body {
        background-color: #0f172a;
        margin: 0;
        padding: 0;
        color: #f8fafc;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
      #root {
        min-height: 100vh;
        position: relative;
        z-index: 1;
      }
      /* Statyczny kontener obrazu LCP: wykrywany natychmiast przez parser HTML przed uruchomieniem Reacta */
      #hero-lcp-frame {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 520px;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      #hero-lcp-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #modal-root {
        position: relative;
        z-index: 9999;
      }
      #modal-root:empty {
        display: none !important;
        height: 0 !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      /* Blokada skoków nagłówka H1 (CLS = 0) */
      h1 {
        line-height: 1.15 !important;
        margin-top: 0;
      }
      h1 span.font-major-mono {
        display: block;
        min-height: 2.5rem;
        line-height: 1.15;
      }
      h1 span.font-limelight {
        display: block;
        min-height: 3.5rem;
        line-height: 1.25;
      }
      .hero-section {
        position: relative;
        contain: layout;
        background-color: transparent !important;
      }
    </style>
